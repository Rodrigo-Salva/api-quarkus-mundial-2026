version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  PERFIL PRODUCCIÓN — usa imagen pre-construida de Docker Hub
#
#  Uso:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  No necesita Java, Maven ni código fuente.
#  Solo necesita: Docker + .env con credenciales
# ═══════════════════════════════════════════════════════════════

services:

  api-1:
    image: ${DOCKER_IMAGE:-rodrigo/mundial2026-api:latest}
    container_name: mundial_api_1
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-1"
      QUARKUS_PROFILE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    image: ${DOCKER_IMAGE:-rodrigo/mundial2026-api:latest}
    container_name: mundial_api_2
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-2"
      QUARKUS_PROFILE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    image: ${DOCKER_IMAGE:-rodrigo/mundial2026-api:latest}
    container_name: mundial_api_3
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-3"
      QUARKUS_PROFILE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mundial_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  PERFIL DESARROLLO — construye la imagen localmente
#
#  Uso:
#    docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
#  Requiere haber corrido antes:
#    ./mvnw package -DskipTests
# ═══════════════════════════════════════════════════════════════

services:

  api-1:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: mundial_api_1
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-mundial_user}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev_password}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: mundial_api_2
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-mundial_user}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev_password}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: mundial_api_3
    env_file: .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mundial2026}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-mundial_user}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev_password}
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb:8000
      QUARKUS_HTTP_PORT: "8080"
      INSTANCE_ID: "api-3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mundial_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

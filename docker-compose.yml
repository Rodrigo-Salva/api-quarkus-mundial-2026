version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  INFRAESTRUCTURA BASE — usada por todos los perfiles
#  Incluye: PostgreSQL, Redis, Kafka, DynamoDB
#
#  USO:
#    Desarrollo:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#    Producción:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#    Solo infra:  docker-compose up -d
# ═══════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: mundial_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mundial2026}
      POSTGRES_USER:     ${DB_USER:-mundial_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mundial_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mundial_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mundial_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "mundial2026-kafka-cluster-01"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mundial_kafka_ui
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mundial-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: mundial_dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    restart: unless-stopped

  # ── MinIO — S3 compatible para desarrollo local ───────────────
  minio:
    image: minio/minio:latest
    container_name: mundial_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY:-dev_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dev_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crea los buckets automáticamente al arrancar
  minio-setup:
    image: minio/mc:latest
    container_name: mundial_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-dev_access_key} ${S3_SECRET_KEY:-dev_secret_key};
      mc mb --ignore-existing local/mundial-avatars;
      mc mb --ignore-existing local/mundial-leagues;
      mc mb --ignore-existing local/mundial-exports;
      mc anonymous set download local/mundial-avatars;
      mc anonymous set download local/mundial-leagues;
      echo 'Buckets creados correctamente';
      "
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:

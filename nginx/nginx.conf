# ── Nginx optimizado para alta concurrencia (60,000 usuarios) ─────
worker_processes auto;          # 1 worker por CPU core
worker_rlimit_nofile 100000;    # máx archivos abiertos por worker

events {
    worker_connections  10000;  # conexiones por worker → total = cores × 10000
    use epoll;                  # I/O más eficiente en Linux
    multi_accept on;            # acepta múltiples conexiones a la vez
}

http {

    # ── Upstream: 3 instancias de Quarkus ─────────────────────────
    upstream predictions_api {
        least_conn;
        server api-1:8080 max_fails=3 fail_timeout=30s;
        server api-2:8080 max_fails=3 fail_timeout=30s;
        server api-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 1000;         # conexiones persistentes al backend
    }

    # ── Optimizaciones TCP ─────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  10000;
    reset_timedout_connection on;

    # ── Buffers ────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    client_max_body_size        10m;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    proxy_buffer_size           128k;
    proxy_buffers               4 256k;
    proxy_busy_buffers_size     256k;

    # ── Compresión gzip ────────────────────────────────────────────
    gzip on;
    gzip_min_length  1000;
    gzip_proxied     any;
    gzip_types       application/json text/plain;

    # ── Cache para endpoints de solo lectura ───────────────────────
    # Rankings y partidos: 5s de cache absorbe los picos del mundial
    proxy_cache_path /tmp/nginx_cache levels=1:2
                     keys_zone=api_cache:50m
                     max_size=500m
                     inactive=60s
                     use_temp_path=off;

    # ── Rate limiting generoso ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name localhost;

        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Cache-Status    $upstream_cache_status always;

        # ── Lectura frecuente: con cache 5s ───────────────────────
        location ~ ^/api/(matches|rankings|odds) {
            limit_req  zone=api_limit burst=500 nodelay;
            limit_conn conn_limit 50;

            proxy_cache            api_cache;
            proxy_cache_valid      200 5s;
            proxy_cache_use_stale  error timeout updating;
            proxy_cache_lock       on;
            proxy_cache_key        "$request_method$request_uri";

            proxy_pass         http://predictions_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Escritura: sin cache ───────────────────────────────────
        location /api/ {
            limit_req  zone=api_limit burst=200 nodelay;
            limit_conn conn_limit 30;

            proxy_pass         http://predictions_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── WebSocket ──────────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://predictions_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── Health check Nginx ─────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }
    }
}

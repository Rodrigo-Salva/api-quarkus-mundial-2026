# ═══════════════════════════════════════════════════════
#  MUNDIAL 2026 - PREDICTIONS API
#  application.properties
# ═══════════════════════════════════════════════════════

# Aplicación
quarkus.application.name=predictions-api
quarkus.http.port=8080

# ── Alta concurrencia ─────────────────────────────────────────────
# Virtual threads: 1 hilo virtual por request (soporta miles sin bloquear OS)
quarkus.rest.virtual-threads=true
# Servidor HTTP — aumentar workers y conexiones aceptadas
quarkus.vertx.worker-pool-size=200
quarkus.http.io-threads=16
quarkus.http.so-reuse-port=true
# Tiempo máximo de espera antes de rechazar request
quarkus.http.idle-timeout=PT30S
quarkus.http.read-timeout=PT10S

# Deshabilitar Dev Services (usamos nuestro propio Docker Compose)
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.redis.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# Base de datos (PostgreSQL) — configura DB_USER, DB_PASSWORD y DB_URL en .env
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:mundial_user}
quarkus.datasource.password=${DB_PASSWORD:28demarzo}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/mundial2026}
# Pool de conexiones optimizado para alta concurrencia
quarkus.datasource.jdbc.max-size=200
quarkus.datasource.jdbc.min-size=20
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.idle-removal-interval=PT5M
quarkus.datasource.jdbc.max-lifetime=PT30M
# Cache de segundo nivel para queries frecuentes
quarkus.hibernate-orm.second-level-caching-enabled=true

# Hibernate ORM — Flyway maneja el DDL, Hibernate solo valida
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# Flyway (migraciones automáticas)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# Redis
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.timeout=2s

# Kafka
kafka.bootstrap.servers=localhost:9092

# Incoming - Eventos de partidos
mp.messaging.incoming.match-events-in.connector=smallrye-kafka
mp.messaging.incoming.match-events-in.topic=match.events
mp.messaging.incoming.match-events-in.group.id=predictions-group
mp.messaging.incoming.match-events-in.auto.offset.reset=earliest
mp.messaging.incoming.match-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Incoming - Predicciones enviadas por usuarios
mp.messaging.incoming.predictions-in.connector=smallrye-kafka
mp.messaging.incoming.predictions-in.topic=predictions.submitted
mp.messaging.incoming.predictions-in.group.id=predictions-group
mp.messaging.incoming.predictions-in.auto.offset.reset=earliest
mp.messaging.incoming.predictions-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Incoming - Notificaciones push
mp.messaging.incoming.notifications-in.connector=smallrye-kafka
mp.messaging.incoming.notifications-in.topic=notifications.push
mp.messaging.incoming.notifications-in.group.id=notifications-group
mp.messaging.incoming.notifications-in.auto.offset.reset=earliest
mp.messaging.incoming.notifications-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Outgoing - Eventos de partidos
mp.messaging.outgoing.match-events-out.connector=smallrye-kafka
mp.messaging.outgoing.match-events-out.topic=match.events
mp.messaging.outgoing.match-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing - Predicciones
mp.messaging.outgoing.predictions-out.connector=smallrye-kafka
mp.messaging.outgoing.predictions-out.topic=predictions.submitted
mp.messaging.outgoing.predictions-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing - Notificaciones push
mp.messaging.outgoing.notifications-out.connector=smallrye-kafka
mp.messaging.outgoing.notifications-out.topic=notifications.push
mp.messaging.outgoing.notifications-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# IA — Estadísticas con IA (cambiar provider sin tocar código)
# Opciones: gemini | chatgpt | claude | grok
ai.provider=gemini
ai.gemini.api-key=${AI_GEMINI_API_KEY:not-configured}
ai.gemini.model=gemini-1.5-flash
ai.chatgpt.api-key=${AI_CHATGPT_API_KEY:not-configured}
ai.chatgpt.model=gpt-4o-mini
ai.claude.api-key=${AI_CLAUDE_API_KEY:not-configured}
ai.claude.model=claude-haiku-4-5-20251001
ai.grok.api-key=${AI_GROK_API_KEY:not-configured}
ai.grok.model=grok-beta

# Outgoing - Apuestas colocadas
mp.messaging.outgoing.bets-out.connector=smallrye-kafka
mp.messaging.outgoing.bets-out.topic=bets.placed
mp.messaging.outgoing.bets-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing - Rankings actualizados
mp.messaging.outgoing.rankings-out.connector=smallrye-kafka
mp.messaging.outgoing.rankings-out.topic=rankings.updated
mp.messaging.outgoing.rankings-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Storage — S3 / MinIO
# En desarrollo apunta a MinIO local (docker-compose)
# En producción apunta a AWS S3 (sin endpoint-override)
storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.region=${S3_REGION:us-east-1}
storage.access-key=${S3_ACCESS_KEY:dev_access_key}
storage.secret-key=${S3_SECRET_KEY:dev_secret_key}
storage.path-style=${S3_PATH_STYLE:true}
storage.public-url=${S3_PUBLIC_URL:http://localhost:9000}

# JWT / Seguridad
mp.jwt.verify.issuer=https://mundial2026.com
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=900

# DynamoDB
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local
quarkus.dynamodb.endpoint-override=http://localhost:8000
quarkus.dynamodb.sync-client.type=url

# OpenAPI / Swagger UI
mp.openapi.info.title=Mundial 2026 — Predictions API
mp.openapi.info.version=1.0.0
mp.openapi.info.description=API REST para predicciones del Mundial de Futbol 2026. Permite registrarse, predecir resultados, ganar puntos, competir en salas privadas y ver estadisticas con IA. Para empezar: POST /api/auth/login y luego usa el token en Authorize.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.title=Mundial 2026 API
quarkus.smallrye-openapi.path=/q/openapi

# Health checks
quarkus.smallrye-health.root-path=/health

# Métricas Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.traces.enabled=true

# URL del frontend (usada para generar links de invitación)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# CORS (permitir frontend Next.js en desarrollo)
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=X-Upstream-Server,X-Cache-Status
quarkus.http.cors.access-control-max-age=PT24H

# WebSocket
quarkus.websockets-next.server.supported-subprotocols=predictions-protocol

# ═══════════════════════════════════════════════════════
#  PERFIL: DEV
# ═══════════════════════════════════════════════════════
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.datasource.jdbc.max-size=5
%dev.quarkus.datasource.jdbc.min-size=1
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.mundial2026".level=DEBUG
%dev.quarkus.devservices.enabled=false

# ═══════════════════════════════════════════════════════
#  PERFIL: TEST
# ═══════════════════════════════════════════════════════
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${DB_USER:mundial_user}
%test.quarkus.datasource.password=${DB_PASSWORD:dev_password}
%test.quarkus.datasource.jdbc.url=${DB_URL_TEST:jdbc:postgresql://localhost:5433/mundial2026_test}
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.devservices.enabled=false

# ═══════════════════════════════════════════════════════
#  PERFIL: PROD (AWS ECS Fargate)
# ═══════════════════════════════════════════════════════
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mundial2026}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
%prod.kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.mundial2026".level=INFO
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:https://mundial2026.com}
%prod.quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}
%prod.quarkus.dynamodb.aws.credentials.type=default
%prod.quarkus.dynamodb.endpoint-override=${DYNAMODB_ENDPOINT:}
